<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MR's Momos</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f8f8f8;
}

header{
    background:#c62828;
    color:white;
    text-align:center;
    padding:30px 20px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.menu{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.card{
    background:white;
    border-radius:10px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.price{
    color:#c62828;
    font-weight:bold;
    font-size:18px;
}

.add-btn{
    background:#c62828;
    color:white;
    border:none;
    width:100%;
    padding:10px;
    border-radius:6px;
    cursor:pointer;
}

.order-box{
    background:white;
    margin-top:25px;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

input, textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:6px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    border-bottom:1px solid #eee;
    padding-bottom:10px;
}

.qty-btn{
    padding:4px 10px;
    margin:0 3px;
    cursor:pointer;
}

.remove-btn{
    background:red;
    color:white;
    border:none;
    padding:5px 10px;
    border-radius:5px;
    cursor:pointer;
}

.whatsapp{
    background:#25D366;
    color:white;
    border:none;
    width:100%;
    padding:14px;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

.review{
    background:white;
    margin-top:10px;
    padding:15px;
    border-radius:10px;
}

.total{
    font-size:20px;
    font-weight:bold;
    margin-top:15px;
}
</style>
</head>

<body>

<header>
    <h1>🥟 MR's Momos</h1>
    <p>Fresh • Hot • Delicious</p>
</header>

<div class="container">

<h2>Our Menu</h2>

<div class="menu" id="menu"></div>

<div class="order-box">

<h2>Your Cart</h2>

<div id="cartItems"></div>

<div class="total">
Total: CAD $<span id="total">0.00</span>
</div>

<hr><br>

<h2>Customer Details</h2>

<label>Name</label>
<input type="text" id="name">

<label>Phone Number</label>
<input type="text" id="phone">

<label>Pickup Date</label>
<input type="date" id="pickupDate">

<label>Pickup Time</label>
<input type="time" id="pickupTime">

<label>Special Instructions</label>
<textarea id="notes"></textarea>

<button class="whatsapp" onclick="sendOrder()">
Order on WhatsApp
</button>

<div style="text-align:center;margin:30px 0;">

<h2>Love Our Momos?</h2>

<p>Leave us a Google Review ⭐⭐⭐⭐⭐</p>

<a href="https://g.page/r/CfCPNwPM8FYAEBM/review"
   target="_blank">

<button style="
background:#4285F4;
color:white;
padding:12px 25px;
border:none;
border-radius:8px;
cursor:pointer;">
Leave a Google Review
</button>

</a>

</div>

<script>

const menuItems = [
{name:"Veg Steamed Momos", price:9.99},
{name:"Cheesy Corn Chilli Momos", price:12.00},
{name:"Paneer Momos", price:12.00},
{name:"Veg Fried Momos", price:12.00},
{name:"Noodels", price:12.00},
{name:"Paneer Fried Momos", price:11.99},
{name:"Tandoori Veg Momos", price:12.99},
{name:"Tandoori Chicken Momos", price:13.99},
{name:"Masala Fries", price:5.99},
{name:"Cold Drink", price:2.49}
];

const cart = [];

function loadMenu(){

let html="";

menuItems.forEach((item,index)=>{

html += `
<div class="card">
<h3>${item.name}</h3>
<p class="price">CAD $${item.price.toFixed(2)}</p>
<button class="add-btn" onclick="addToCart(${index})">
Add To Cart
</button>
</div>
`;

});

document.getElementById("menu").innerHTML = html;
}

function addToCart(index){

const existing = cart.find(i=>i.name===menuItems[index].name);

if(existing){
existing.qty++;
}
else{
cart.push({
name:menuItems[index].name,
price:menuItems[index].price,
qty:1
});
}

renderCart();
}

function increase(index){
cart[index].qty++;
renderCart();
}

function decrease(index){

if(cart[index].qty > 1){
cart[index].qty--;
}
else{
cart.splice(index,1);
}

renderCart();
}

function removeItem(index){
cart.splice(index,1);
renderCart();
}

function renderCart(){

let html="";
let total=0;

cart.forEach((item,index)=>{

const subtotal = item.price * item.qty;
total += subtotal;

html += `
<div class="cart-item">
<div>
<strong>${item.name}</strong><br>
CAD $${item.price.toFixed(2)}
</div>

<div>
<button class="qty-btn" onclick="decrease(${index})">-</button>
${item.qty}
<button class="qty-btn" onclick="increase(${index})">+</button>

<button class="remove-btn"
onclick="removeItem(${index})">
Remove
</button>
</div>
</div>
`;
});

document.getElementById("cartItems").innerHTML = html;
document.getElementById("total").innerText = total.toFixed(2);
}

function sendOrder(){

if(cart.length===0){
alert("Please add items to cart.");
return;
}

let itemsText="";

cart.forEach(item=>{
itemsText += `${item.qty} x ${item.name}\n`;
});

const total=document.getElementById("total").innerText;

const message =
`🥟 MR's MOMOS ORDER

Name: ${document.getElementById("name").value}

Phone: ${document.getElementById("phone").value}

Pickup Date: ${document.getElementById("pickupDate").value}

Pickup Time: ${document.getElementById("pickupTime").value}

Items:
${itemsText}

Total: CAD $${total}

Notes:
${document.getElementById("notes").value}
`;

const whatsapp = "18252505474";

window.open(
"https://wa.me/" + whatsapp + "?text=" +
encodeURIComponent(message),
"_blank"
);

}

loadMenu();

</script>

</body>
</html>
