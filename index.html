<script>

/* =====================================================
   MR'S MOMOS — CLOSED UNTIL 5:00 PM TODAY
   Automatically reopens at 5:00 PM
===================================================== */

(function () {

    function checkOpeningTime() {

        const now = new Date();

        /*
         * Today's opening time = 5:00 PM
         */
        const openingTime = new Date();

        openingTime.setHours(17, 0, 0, 0);

        /*
         * If current time is before 5:00 PM,
         * ordering is CLOSED.
         */
        const closedUntilFive = now < openingTime;

        if (!closedUntilFive) {
            enableOrdering();
            return;
        }

        disableOrdering();

        /*
         * Check again every 30 seconds.
         * This allows the website to automatically
         * reopen shortly after 5:00 PM.
         */
        setTimeout(checkOpeningTime, 30000);
    }


    /* =================================================
       DISABLE ORDERING
    ================================================= */

    function disableOrdering() {

        /* Remove previous banner if it exists */
        const oldBanner =
            document.getElementById("closedBanner");

        if (oldBanner) {
            oldBanner.remove();
        }


        /* CLOSED BANNER */

        const banner =
            document.createElement("div");

        banner.id = "closedBanner";

        banner.innerHTML = `
            🔴 <strong>MR's Momos is CLOSED</strong>
            — Online ordering opens at 5:00 PM today ❤️
        `;

        banner.style.cssText = `
            background:#c1121f;
            color:white;
            text-align:center;
            padding:14px 12px;
            font-size:18px;
            font-weight:600;
            position:relative;
            z-index:99999;
        `;

        document.body.insertBefore(
            banner,
            document.body.firstChild
        );


        /* Disable Order Now buttons */

        document
        .querySelectorAll('a[href="#menu"], .order-btn')
        .forEach(function(button) {

            button.style.pointerEvents = "none";
            button.style.opacity = "0.55";

            if (button.classList.contains("order-btn")) {
                button.innerText = "🔴 CLOSED UNTIL 5 PM";
            }

        });


        /* Disable Add To Cart */

        document
        .querySelectorAll(".add-btn")
        .forEach(function(button) {

            button.disabled = true;

            button.innerText =
                "🔴 CLOSED UNTIL 5 PM";

            button.style.opacity = "0.5";
            button.style.cursor = "not-allowed";

        });


        /* Disable Build Your Box +/- buttons */

        document
        .querySelectorAll(".momo-qty-btn")
        .forEach(function(button) {

            button.disabled = true;

            button.style.opacity = "0.5";
            button.style.cursor = "not-allowed";

        });


        /* Disable WhatsApp order */

        document
        .querySelectorAll(".whatsapp")
        .forEach(function(button) {

            button.disabled = true;

            button.innerText =
                "🔴 Orders Open At 5:00 PM";

            button.style.opacity = "0.5";
            button.style.cursor = "not-allowed";

            button.onclick = function(event) {

                event.preventDefault();
                event.stopPropagation();

                alert(
                    "🔴 MR's Momos is currently CLOSED.\n\n" +
                    "Online ordering will reopen at 5:00 PM today. ❤️"
                );

                return false;

            };

        });


        /* Disable payment */

        const payment =
            document.getElementById("payment");

        if (payment) {
            payment.disabled = true;
        }


        /* Disable pickup time */

        const pickupTime =
            document.getElementById("pickupTime");

        if (pickupTime) {
            pickupTime.disabled = true;
        }


        /* Disable cart button */

        const cartButton =
            document.querySelector(".cart-count");

        if (cartButton) {

            cartButton.style.opacity = "0.5";
            cartButton.style.cursor = "not-allowed";

            cartButton.onclick = function(event) {

                event.preventDefault();
                event.stopPropagation();

                alert(
                    "🔴 Ordering is currently CLOSED.\n\n" +
                    "Please come back at 5:00 PM today. ❤️"
                );

                return false;

            };

        }


        /* Disable Square */

        const squareButton =
            document.getElementById("squarePayBtn");

        if (squareButton) {

            squareButton.disabled = true;

            squareButton.innerText =
                "🔴 CLOSED UNTIL 5 PM";

            squareButton.style.opacity = "0.5";

        }

    }


    /* =================================================
       ENABLE ORDERING AFTER 5 PM
    ================================================= */

    function enableOrdering() {

        /* Remove closed banner */

        const banner =
            document.getElementById("closedBanner");

        if (banner) {
            banner.remove();
        }


        /* Enable Order Now */

        document
        .querySelectorAll('a[href="#menu"], .order-btn')
        .forEach(function(button) {

            button.style.pointerEvents = "auto";
            button.style.opacity = "1";

            if (button.classList.contains("order-btn")) {
                button.innerText = "Order Now";
            }

        });


        /* Enable Add To Cart */

        document
        .querySelectorAll(".add-btn")
        .forEach(function(button) {

            button.disabled = false;

            button.innerText =
                button.getAttribute("data-original-text") ||
                "Add To Cart";

            button.style.opacity = "1";
            button.style.cursor = "pointer";

        });


        /* Enable Build Your Box */

        document
        .querySelectorAll(".momo-qty-btn")
        .forEach(function(button) {

            button.disabled = false;

            button.style.opacity = "1";
            button.style.cursor = "pointer";

        });


        /* Enable WhatsApp */

        document
        .querySelectorAll(".whatsapp")
        .forEach(function(button) {

            button.disabled = false;

            button.innerText =
                "💬 Place Order On WhatsApp";

            button.style.opacity = "1";
            button.style.cursor = "pointer";

            /*
             * Restore original function
             */
            button.onclick = sendWhatsApp;

        });


        /* Enable payment */

        const payment =
            document.getElementById("payment");

        if (payment) {
            payment.disabled = false;
        }


        /* Enable pickup time */

        const pickupTime =
            document.getElementById("pickupTime");

        if (pickupTime) {
            pickupTime.disabled = false;
        }


        /* Enable cart */

        const cartButton =
            document.querySelector(".cart-count");

        if (cartButton) {

            cartButton.style.opacity = "1";
            cartButton.style.cursor = "pointer";

            cartButton.onclick = scrollToCart;

        }


        /* Enable Square */

        const squareButton =
            document.getElementById("squarePayBtn");

        if (squareButton) {

            squareButton.disabled = false;

            squareButton.innerText =
                "💳 Pay Online";

            squareButton.style.opacity = "1";

        }

    }


    /*
     * Save original Add To Cart text
     */

    document
    .querySelectorAll(".add-btn")
    .forEach(function(button) {

        if (!button.getAttribute("data-original-text")) {

            button.setAttribute(
                "data-original-text",
                button.innerText
            );

        }

    });


    /*
     * Start checking
     */

    checkOpeningTime();

})();

</script>
